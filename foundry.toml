[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = ["vendor", "node_modules"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=vendor/forge-std/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 256
seed = "0x696e74656c696f"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 110

